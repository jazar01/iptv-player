       black nose, tongue out, dark collar. The source of the app's logo:
       scripts\make-icons.ps1 and make-ui-assets.ps1 draw it at each size (art\ isn't packaged).
       Their renderer reads <path d> (M, L, C, Z, absolute only), fill, stroke,
       stroke-width and stroke-linecap, and <circle>. -->
